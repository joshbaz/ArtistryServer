      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [new, contacted, confirmed, declined] }, talentOutcomes: { type: object, additionalProperties: { type: string, enum: [pending, confirmed, unavailable, declined] } }, via: { type: string, enum: [email, WhatsApp, phone] } } } } } }
      responses:
        '200': { description: OK }
    delete:
      tags: [Talent]
      summary: Delete a request (Content Manager)
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      responses:
        '204': { description: Deleted }
  /talent/bookings/{id}/notes:
    post:
      tags: [Talent]
      summary: Add a staff note to the history (Content Manager)
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 1000 } } } } } }
      responses:
        '201': { description: The request }
  /streaming/titles:
    get:
      tags: [Streaming]
      summary: Public titles (published, with something to watch); ?q= searches title, story, cast and crew
      parameters: [{ in: query, name: q, schema: { type: string } }]
      responses:
        '200': { description: 'Titles; never a playback link or upload details' }
    post:
      tags: [Streaming]
      summary: A new title (Content Manager); always a draft with no video; format series starts with Season 1
      security: [{ bearer: [] }]
      responses:
        '201': { description: The title }
        '422': { description: Unknown type or category, ppv under UGX 500, scheduled without a future time }
  /streaming/titles/{id}:
    get:
      tags: [Streaming]
      summary: One public title (404 for anything not public)
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,59}$' } }]
      responses: { '200': { description: The title }, '404': { description: Not public } }
    patch:
      tags: [Streaming]
      summary: Edit a title (Content Manager); video, trailer, views and format are not set here
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,59}$' } }]
      responses: { '200': { description: The title } }
    delete:
      tags: [Streaming]
      summary: Delete a title (it also leaves the stream site hero)
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,59}$' } }]
      responses: { '204': { description: Gone } }
  /streaming/studio/titles:
    get:
      tags: [Streaming]
      summary: Every title, drafts too (any Studio role); /streaming/studio/titles/{id} for one
      security: [{ bearer: [] }]
      responses: { '200': { description: Titles } }
  /streaming/titles/{id}/seasons:
    post:
      tags: [Streaming]
      summary: 'Add a season to a series. Also: PATCH/DELETE …/seasons/{n}, POST …/seasons/{n}/episodes, PATCH/DELETE …/episodes/{episodeId}, DELETE …/episodes/{episodeId}/video, DELETE …/video, PATCH/DELETE …/trailer'
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,59}$' } }]
      responses:
        '201': { description: The whole title }
        '409': { description: 'not_series, season_not_empty, a taken episode number, or someone else saved first' }
  /streaming/types:
    get:
      tags: [Streaming]
      summary: 'Video types { id, name, slug }; POST, PATCH/DELETE /{id} (Content Manager; 409 type_in_use). /streaming/categories and /streaming/advisories work the same'
      responses: { '200': { description: The list } }
  /streaming/plans:
    get:
      tags: [Streaming]
      summary: Active plans in order; the Studio reads all at /streaming/studio/plans; POST, PATCH/DELETE /{id} (Finance)
      responses: { '200': { description: Plans } }
  /streaming/subscribers:
    get:
      tags: [Streaming]
      summary: Subscribers (Finance); empty until streaming takes payments
      security: [{ bearer: [] }]
      responses: { '200': { description: '[]' } }
  /streaming/ads:
    get:
      tags: [Streaming]
      summary: Ad settings (any Studio role); PATCH merges a section in (Content Manager)
      security: [{ bearer: [] }]
      responses: { '200': { description: '{ general, web, app }' } }
  /streaming/uploads:
    post:
      tags: [Streaming]
      summary: 'Start an upload to Spaces (Content Manager): { titleId, episodeId?, kind: video|trailer, fileName, size, contentType } → { assetId, partSize, partCount }. The slot shows uploading; the video it held is deleted'
      security: [{ bearer: [] }]
      responses: { '201': { description: '{ assetId, status, progress, partSize, partCount }' }, '404': { description: No such title or episode }, '503': { description: 'uploads_not_connected (no Spaces bucket set up)' } }
  /streaming/uploads/{assetId}:
    get:
      tags: [Streaming]
      summary: 'An upload''s state (Content Manager): { status: uploading|processing|ready|failed, progress, error }. POST /parts { partNumbers } → [{ partNumber, url }] to PUT each part to; POST /complete; POST /abort { failed?, error? }'
      security: [{ bearer: [] }]
      parameters: [{ name: assetId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: '{ assetId, status, progress, partSize, partCount, duration, error }' }, '409': { description: 'parts_missing (complete) or upload_closed (parts)' } }
  /streaming/playback:
    post:
      tags: [Streaming]
      summary: 'A playback link for one viewer: { titleId, episodeId? } → { url, expiresAt, duration, intro }. Free titles play signed out; others 401, then 403 locked with details.reason (subscribe | rent + priceUGX). /streaming/studio/playback previews any title (any Studio role)'
      responses: { '200': { description: 'url: /streaming/play/{token}/master.m3u8, good for 6 hours' }, '403': { description: locked }, '409': { description: not_ready } }
  /streaming/play/{token}/master.m3u8:
    get:
      tags: [Streaming]
      summary: 'The HLS master playlist behind a playback link; {size}/index.m3u8 lists its pieces (on the Spaces CDN) and /key is the AES-128 key'
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: application/vnd.apple.mpegurl }, '403': { description: playback_expired } }
  /library:
    get:
      tags: [Streaming]
      summary: 'The signed-in member''s library { watchlist, ratings, progress, episodes }. Also GET /library/access (plan and rentals), /watchlist, /ratings, /progress, /episode-progress, /comment-likes; PUT/DELETE /watchlist/{titleId} and /ratings/{titleId} { rating }; PUT /progress { titleId, episodeId?, seconds, duration }; DELETE /progress[/{titleId}]'
      security: [{ bearer: [] }]
      responses: { '200': { description: '{ watchlist[], ratings{}, progress{}, episodes{} }' }, '401': { description: Sign in } }
  /streaming/titles/{id}/comments:
    get:
      tags: [Streaming]
      summary: 'A title''s visible comments, newest first. POST { body, spoiler } (member; 500 characters, 5 a minute); POST /{cid}/like (toggles), /{cid}/report (three hide it); DELETE /{cid} (own). Studio: GET /streaming/studio/comments?status=, PATCH/DELETE /streaming/studio/comments/{cid} (Content Manager)'
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: '[{ id, author{ id, name }, body, spoiler, likes, createdAt }]' } }
  /payments/history:
    get:
      tags: [Payments]
      summary: 'The signed-in member''s streaming receipts, paid and refunded. POST /payments/subscription/cancel and /resume say whether a plan is meant to renew'
      security: [{ bearer: [] }]
      responses: { '200': { description: '[{ id, kind, planId?, titleId?, description, amountUGX, method, reference, status, paidAt }]' } }
  /stream/site:
    get:
      tags: [Streaming]
      summary: The stream site home page settings (public); PATCH (Content Manager) merges sections, rows are replaced whole
      responses: { '200': { description: '{ community, hero{ featuredIds, autoplayTrailers }, rows[], announcement }' } }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string }
            details: { type: object }
            requestId: { type: string }
    CampaignInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        startDate: { type: string, example: '2026-11-01', description: 'YYYY-MM-DD, Kampala time' }
        endDate: { type: string, example: '2026-11-30' }
        image: { type: string, description: 'https:// link or image data URL' }
        category: { type: string }
        organizer: { type: string }
        organizerBadge: { type: string, enum: [official, verified] }
        publishStatus: { type: string, enum: [draft, published], description: 'PATCH only' }
        featured: { type: boolean }
        votePriceUGX: { type: integer }
        vipPriceUGX: { type: integer }
        vipDailyVotes: { type: integer }
        vipTicketPerk: { type: string }
        winner: { type: string }
        logo: { type: string }
        prize: { type: string }
        rules: { type: string }
    AdminUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [super-admin, content-manager, finance, moderator] }
    StudioSession:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string, description: 'Admin-realm JWT, 15 minutes' }
