      tags: [Website]
      summary: Add an article (Content Manager)
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title, category, date], properties: { title: { type: string }, excerpt: { type: string }, content: { type: string }, location: { type: string }, category: { type: string }, date: { type: string, example: '2026-11-30' }, endDate: { type: string }, image: { type: string }, status: { type: string, enum: [Published, Draft] } } } } } }
      responses:
        '201': { description: The article }
