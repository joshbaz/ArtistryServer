      responses:
        '200': { description: OK }
    post:
      tags: [Talent]
      summary: Add a monologue (Content Manager)
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [talentId, title, source, url], properties: { talentId: { type: string, example: T-001 }, title: { type: string }, source: { type: string, enum: [youtube, upload] }, url: { type: string, description: 'A YouTube link with a video id, or an https playback URL' }, duration: { type: integer } } } } } }
      responses:
        '201': { description: The monologue }
  /talent/monologues/{id}:
    patch:
      tags: [Talent]
      summary: Edit a monologue (Content Manager); a new url needs its source too
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      responses:
        '200': { description: OK }
    delete:
      tags: [Talent]
      summary: Delete a monologue (Content Manager)
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      responses:
        '204': { description: Deleted }
  /talent/bookings:
    post:
      tags: [Talent]
      summary: A guest's booking request (public, rate limited per IP)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [talentIds, name, projectType, message], properties: { talentIds: { type: array, items: { type: string, example: T-001 } }, name: { type: string }, email: { type: string }, phone: { type: string }, organisation: { type: string }, projectType: { type: string }, dates: { type: string }, message: { type: string }, website: { type: string, description: 'Honeypot: filled means a bot (looks received, nothing saved)' } } } } } }
      responses:
        '201': { description: '{ id, reference, status: received, talentIds, name, email, phone }' }
        '422': { description: 'No published talent among talentIds, or no email or phone' }
    get:
      tags: [Talent]
      summary: Every request, newest first (guest contact details)
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
    patch:
      tags: [Talent]
      summary: One status for several requests (Content Manager)
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids, status], properties: { ids: { type: array, items: { type: string } }, status: { type: string, enum: [new, contacted, confirmed, declined] } } } } } }
      responses:
        '200': { description: The updated requests }
    delete:
      tags: [Talent]
      summary: Delete several requests (Content Manager)
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } } } } }
      responses:
        '204': { description: Deleted }
  /talent/bookings/{id}:
    patch:
      tags: [Talent]
