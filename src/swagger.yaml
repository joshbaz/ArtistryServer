      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      responses:
        '200': { description: OK }
        '404': { description: A draft, deleted or unknown article }
  /content/news:
    get:
      tags: [Website]
