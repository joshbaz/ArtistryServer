openapi: 3.0.0
info:
  title: Artistry360 API
  version: 1.0.0
  description: |
    The one API for theartistry360.com, the Studio, stream.theartistry360.com and the app.
    Every endpoint path is listed in client/docs/12-backend-integration.md.

    Every success is `{ data }`, or `{ data, meta }` for paged lists; every failure is
    `{ error: { code, message, details?, requestId } }`.
    Signed-in routes take `Authorization: Bearer <accessToken>` (15 minutes, realm `member` or `admin`).
servers:
  - url: http://localhost:5000/api/v1
    description: Development server
  - url: https://api.theartistry360.com/api/v1
    description: Production
tags:
  - name: System
  - name: Studio auth
    description: |
      The Studio's door (admin realm). The access token comes back in the body; the refresh token only
      travels in the httpOnly a360_rt_staff cookie, scoped to /api/v1/auth/studio. Every refresh rotates
      it; the previous one works for 30 seconds more, and after that presenting it revokes the session.
      Sign-in is limited to 5 failed tries per 15 minutes per IP and email.
  - name: Member auth
    description: |
      Members (member realm): voters now, the stream site and the app later. Sign in with a Google or Apple ID token,
      checked against our client ids. On the web the refresh token is the httpOnly a360_rt_member cookie on /api/v1/auth;
      with X-Client: mobile it comes back in the body instead and is sent back as { refreshToken }.
  - name: Voting
    description: Published campaigns and their leaderboards, which anyone may read, and the signed-in voter's free vote.
  - name: Studio voting
    description: |
      Every campaign, drafts included, and its contestants (admin realm). Any Studio role reads; a Content Manager
      edits; taking down, restoring and deleting are a Super Admin's. Full rules: client/docs/12-backend-integration.md.
  - name: Organiser requests
  - name: Payments
    description: |
      PesaPal checkouts. Only PesaPal's word completes an order: its IPN, or the server's own status check when the
      payer returns. Votes are added once, in the same transaction that completes the order.
  - name: Organiser auth
    description: The organizer realm, shaped like Studio auth. Cookie a360_rt_organizer on /api/v1/auth/organizer.
  - name: Organiser dashboard
    description: The signed-in organiser's own campaigns, contestants, results, payouts and profile. Someone else's campaign is a 404.
  - name: Streaming
    description: |
      The catalogue stream.theartistry360.com and the app read (published titles, types, categories, warnings, active
      plans, the home page settings) and Studio › Streaming. Any Studio role reads /streaming/studio; a Content Manager
      edits the library, lists, ads and stream site; Finance edits plans. Videos are set only by uploads, never by a form.
  - name: Studio organisers
    description: Organiser accounts, invites, access and share (Super Admin); payout requests (Finance).
  - name: Website
    description: |
      Studio › Website and the public pages it feeds: News & Events, the gallery, live classes and the Studio's
      option lists. The public reads need no sign-in and show published or visible items only; any Studio role
      reads the rest, and a Content Manager edits.
  - name: Talent
    description: |
      The roster (one list: the Studio sees every field; talent/profiles only an allowlist, never the surname,
      phone or email), monologues, and booking requests. A talent is addressed by its slug (t-001), its public
      reference is T-001; neither changes or is reused. A booking's history is written by the server, with the
      staff member's name from their session.
paths:
  /health:
    get:
      tags: [System]
      summary: Whether the database and Redis answer
      responses:
        '200':
          description: Everything is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Something is down
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /auth/studio/login:
    post:
      tags: [Studio auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Signed in; sets the a360_rt_staff cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioSession' }
        '401': { description: 'INVALID_CREDENTIALS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ACCOUNT_SUSPENDED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'Field errors in details.fieldErrors', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'Too many failed tries', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/studio/refresh:
    post:
      tags: [Studio auth]
      summary: Trade the refresh cookie for a new access token
      description: Rotates the cookie. Inside the 30-second grace window it answers with no Set-Cookie.
      responses:
        '200':
          description: A new access token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudioSession' }
        '401': { description: 'SESSION_ENDED (cookie cleared)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'ACCOUNT_SUSPENDED, or an unknown Origin', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/studio/logout:
    post:
      tags: [Studio auth]
      summary: End this device's session and clear the cookie
      responses:
        '204': { description: Signed out }
  /auth/studio/me:
    get:
      tags: [Studio auth]
      summary: The signed-in staff member
      security: [{ bearer: [] }]
      responses:
        '200':
          description: The admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminUser' }
        '401': { description: Signed out, session ended or account suspended }
  /voting/campaigns:
    get:
      tags: [Voting]
      summary: Published campaigns
      responses:
        '200': { description: OK }
  /voting/campaigns/{id}:
    get:
      tags: [Voting]
      summary: One published campaign with its leaderboard
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      responses:
        '200': { description: '{ campaign, participants }' }
        '404': { description: Not found or a draft }
  /voting/campaigns/{id}/me:
    get:
      tags: [Voting]
      summary: The signed-in voter's standing in a campaign
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      responses:
        '200': { description: '{ nextFreeVoteAt: string | null, isVip, dailyVotes }' }
        '401': { description: Not signed in }
  /voting/campaigns/{id}/votes:
    post:
      tags: [Voting]
      summary: Cast the free vote
      description: |
        One per voter per campaign every 24 hours, one per device (X-Device-Id) whoever is signed in, and at most 50 per
        network (hashed IP). Only keyed hashes of the IP and device id are stored.
      security: [{ bearer: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }
        - { in: header, name: X-Device-Id, required: true, schema: { type: string, pattern: '^[\w-]{16,128}$' } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [participantId], properties: { participantId: { type: string } } } } } }
      responses:
        '201': { description: '{ participantId, added, isVip, nextFreeVoteAt }' }
        '400': { description: 'device_required' }
        '401': { description: Not signed in }
        '409': { description: 'not_open or closed' }
        '422': { description: Not a contestant in this campaign }
        '429': { description: 'free_vote_used (details.nextAt), device_limit or network_limit' }
  /voting/studio/campaigns/{id}/votes/summary:
    get:
      tags: [Studio voting]
      summary: Votes by source, and whether every contestant's total matches its records
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ totals, contestants, check, people, records }' }
  /voting/studio/campaigns/{id}/votes:
    get:
      tags: [Studio voting]
      summary: Every vote, newest first (names and emails for Super Admin and Moderator only)
      security: [{ bearer: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: type, schema: { type: string, enum: [free, vipDaily, bought, vipInstant] } }
        - { in: query, name: participantId, schema: { type: string } }
        - { in: query, name: before, schema: { type: string, format: date-time }, description: The previous page's meta.next }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: '{ data: votes[], meta: { next, identities } }' }
  /voting/studio/campaigns:
    get:
      tags: [Studio voting]
      summary: Every campaign with revenue
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Studio voting]
      summary: Create a draft campaign
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignInput' } } } }
      responses:
        '201': { description: The draft }
  /voting/studio/stats:
    get:
      tags: [Studio voting]
      summary: Totals for the Voting overview
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
  /voting/studio/campaigns/{id}:
    patch:
      tags: [Studio voting]
      summary: Edit or publish
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignInput' } } } }
      responses:
        '200': { description: OK }
        '409': { description: 'too_few_contestants or rules_locked' }
        '422': { description: 'Field errors, or dates missing or out of order' }
    delete:
      tags: [Studio voting]
      summary: Delete a campaign nobody has voted in (Super Admin)
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      responses:
        '204': { description: Deleted }
        '409': { description: It has votes }
  /voting/studio/campaigns/{id}/close:
    post:
      tags: [Studio voting]
      summary: End voting now, or reopen
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [closed], properties: { closed: { type: boolean } } } } } }
      responses:
        '200': { description: OK }
  /voting/studio/campaigns/{id}/take-down:
    post:
      tags: [Studio voting]
      summary: Take off /voting with a reason (Super Admin)
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses:
        '200': { description: OK }
  /voting/studio/campaigns/{id}/restore:
    post:
      tags: [Studio voting]
      summary: Put a taken-down campaign back (Super Admin)
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      responses:
        '200': { description: OK }
  /voting/studio/campaigns/{id}/contestants:
    get:
      tags: [Studio voting]
      summary: Contestants in number order
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      responses:
        '200': { description: OK }
    post:
      tags: [Studio voting]
      summary: Add a contestant (next number unless one is given)
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [fullName], properties: { fullName: { type: string }, number: { type: integer }, photo: { type: string }, bio: { type: string } } } } } }
      responses:
        '201': { description: The contestant }
        '409': { description: number_taken }
  /voting/studio/contestants/{id}:
    patch:
      tags: [Studio voting]
      summary: Edit a contestant
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { fullName: { type: string }, number: { type: integer }, photo: { type: string }, bio: { type: string } } } } } }
      responses:
        '200': { description: OK }
    delete:
      tags: [Studio voting]
      summary: Remove a contestant with no votes
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      responses:
        '204': { description: Removed }
        '409': { description: They have votes }
  /organisers/requests:
    post:
      tags: [Organiser requests]
      summary: Send a "Run a campaign" request (public, rate limited)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [orgName, contactName, email, phone, campaignType, contestants, start, agreed] } } } }
      responses:
        '201': { description: '{ id, status }' }
    get:
      tags: [Organiser requests]
      summary: Every request, newest first
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
  /organisers/requests/{id}:
    patch:
      tags: [Organiser requests]
      summary: Approve, decline or reopen (Super Admin)
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-f0-9]{24}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [pending, approved, declined] }, campaignId: { type: string } } } } } }
      responses:
        '200': { description: OK }
  /auth/google:
    post:
      tags: [Member auth]
      summary: Sign in with a Google ID token
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [idToken], properties: { idToken: { type: string } } } } } }
      responses:
        '200': { description: '{ accessToken, expiresIn, member } and the cookie (or refreshToken, for mobile)' }
        '401': { description: The token didn't check out }
        '503': { description: 'provider_not_configured' }
  /auth/apple:
    post:
      tags: [Member auth]
      summary: Sign in with an Apple ID token
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [idToken], properties: { idToken: { type: string }, name: { type: string, description: 'Apple gives the page the name on the first sign-in only' } } } } } }
      responses:
        '200': { description: '{ accessToken, expiresIn, member } and the cookie (or refreshToken, for mobile)' }
        '401': { description: The token didn't check out }
        '503': { description: 'provider_not_configured' }
  /auth/refresh:
    post:
      tags: [Member auth]
      summary: Trade the refresh token for a new access token
      responses:
        '200': { description: OK }
        '401': { description: The session has ended }
  /auth/logout:
    post:
      tags: [Member auth]
      summary: Sign out this device
      responses:
        '204': { description: Signed out }
  /auth/me:
    get:
      tags: [Member auth]
      summary: The signed-in member
      security: [{ bearer: [] }]
      responses:
        '200': { description: '{ id, name, email, avatar, provider, role }' }
  /auth/organizer/login:
    post:
      tags: [Organiser auth]
      summary: Sign in
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } } }
      responses:
        '200': { description: '{ accessToken, expiresIn, organizer } and the cookie' }
  /auth/organizer/refresh:
    post:
      tags: [Organiser auth]
      summary: Trade the cookie for a new access token
      responses:
        '200': { description: OK }
  /auth/organizer/logout:
    post:
      tags: [Organiser auth]
      summary: Sign out this device
      responses:
        '204': { description: Signed out }
  /auth/organizer/me:
    get:
      tags: [Organiser auth]
      summary: The signed-in organiser
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
  /auth/organizer/invite/{token}:
    get:
      tags: [Organiser auth]
      summary: Who an invite is for (410 when used or expired)
      parameters: [{ in: path, name: token, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
    post:
      tags: [Organiser auth]
      summary: Accept: set the password and sign in
      parameters: [{ in: path, name: token, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password], properties: { contactName: { type: string }, password: { type: string, minLength: 8 } } } } } }
      responses:
        '200': { description: OK }
  /organizer/campaigns:
    get:
      tags: [Organiser dashboard]
      summary: My campaigns with their setup checklist
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
  /organizer/campaigns/{id}:
    get:
      tags: [Organiser dashboard]
      summary: One of my campaigns
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
    patch:
      tags: [Organiser dashboard]
      summary: Edit the content
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
  /organizer/campaigns/{id}/publish:
    post:
      tags: [Organiser dashboard]
      summary: Publish or back to draft
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [published], properties: { published: { type: boolean } } } } } }
      responses:
        '200': { description: OK }
  /organizer/campaigns/{id}/results:
    get:
      tags: [Organiser dashboard]
      summary: Standings and money
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
  /organizer/campaigns/{id}/contestants:
    get:
      tags: [Organiser dashboard]
      summary: Contestants in number order
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
    post:
      tags: [Organiser dashboard]
      summary: Add one or many (all or none)
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [rows], properties: { rows: { type: array, maxItems: 200, items: { type: object } } } } } } }
      responses:
        '201': { description: The new contestants }
  /organizer/contestants/{id}:
    patch:
      tags: [Organiser dashboard]
      summary: Edit a contestant
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
    delete:
      tags: [Organiser dashboard]
      summary: Remove a contestant with no votes
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '204': { description: Removed }
  /organizer/contestants/{id}/move:
    post:
      tags: [Organiser dashboard]
      summary: Swap with the neighbour above or below
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [step], properties: { step: { type: integer, enum: [-1, 1] } } } } } }
      responses:
        '200': { description: OK }
  /organizer/payments:
    get:
      tags: [Organiser dashboard]
      summary: Payments for my campaigns
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
  /organizer/payouts:
    get:
      tags: [Organiser dashboard]
      summary: What each campaign owes me, and my requests
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Organiser dashboard]
      summary: Ask for what a finished campaign owes
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [campaignId, method, accountName, accountNumber] } } } }
      responses:
        '201': { description: The request }
  /organizer/me:
    get:
      tags: [Organiser dashboard]
      summary: My profile
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
    patch:
      tags: [Organiser dashboard]
      summary: Contact name, phone, logo
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
  /organizer/me/password:
    post:
      tags: [Organiser dashboard]
      summary: Change my password (signs out other sessions)
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [current, next] } } } }
      responses:
        '204': { description: Changed }
  /voting/studio/organizers:
    get:
      tags: [Studio organisers]
      summary: Every organiser with campaigns and open payouts
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
  /voting/studio/organizers/approve:
    post:
      tags: [Studio organisers]
      summary: Approve a request: account, draft campaign, invite
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [requestId, campaign], properties: { requestId: { type: string }, campaign: { $ref: '#/components/schemas/CampaignInput' } } } } } }
      responses:
        '201': { description: '{ organizer, campaign, inviteToken }' }
  /voting/studio/organizers/{id}/invite:
    post:
      tags: [Studio organisers]
      summary: A fresh invite link (also a password reset)
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ organizer, inviteToken }' }
  /voting/studio/organizers/{id}/access:
    post:
      tags: [Studio organisers]
      summary: Turn access off or on
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses:
        '200': { description: OK }
  /voting/studio/organizers/{id}/share:
    post:
      tags: [Studio organisers]
      summary: Set the revenue share
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [sharePercent], properties: { sharePercent: { type: integer, minimum: 0, maximum: 100 } } } } } }
      responses:
        '200': { description: OK }
  /voting/studio/payouts:
    get:
      tags: [Studio organisers]
      summary: Payout requests, open first
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
  /voting/studio/payouts/{id}/paid:
    post:
      tags: [Studio organisers]
      summary: Mark paid with the payment reference
      security: [{ bearer: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reference], properties: { reference: { type: string } } } } } }
      responses:
        '200': { description: OK }
  /payments/orders:
    post:
      tags: [Payments]
      summary: Start buying votes (no sign-in) or a VIP pass (signed-in voter); rate limited
      description: |
        kind votes needs votes (1–10,000). kind vip needs the voter's member token; the price and the votes added at
        once are the campaign's vipPriceUGX and vipDailyVotes. When PesaPal confirms, the pass is granted.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, campaignId, participantId], properties: { kind: { type: string, enum: [votes, vip] }, campaignId: { type: string }, participantId: { type: string }, votes: { type: integer, minimum: 1, maximum: 10000 } } } } } }
      responses:
        '201': { description: "'{ reference, redirectUrl }': send the payer to redirectUrl" }
        '401': { description: VIP while signed out }
        '409': { description: 'not_open, closed or already_vip' }
        '502': { description: PesaPal unreachable }
    get:
      tags: [Payments]
      summary: Voting payments for the Studio (Finance)
      security: [{ bearer: [] }]
      parameters: [{ in: query, name: module, required: true, schema: { type: string, enum: [voting] } }]
      responses:
        '200': { description: Newest first }
  /payments/orders/{reference}:
    get:
      tags: [Payments]
      summary: The payer's own order, checked with PesaPal while pending
      parameters: [{ in: path, name: reference, required: true, schema: { type: string, example: A360-MVML4FY7-FF3C5E } }]
      responses:
        '200': { description: "'{ reference, status, kind, votes, amountUGX, campaignId, participantId }'" }
        '404': { description: No such order }
  /payments/pesapal/ipn:
    get:
      tags: [Payments]
      summary: PesaPal's IPN (registered as GET)
      parameters:
        - { in: query, name: OrderTrackingId, schema: { type: string } }
        - { in: query, name: OrderMerchantReference, schema: { type: string } }
        - { in: query, name: OrderNotificationType, schema: { type: string } }
      responses:
        '200': { description: "'{ orderNotificationType, orderTrackingId, orderMerchantReference, status: 200 }'" }
        '500': { description: 'Same shape with status 500: PesaPal retries' }
    post:
      tags: [Payments]
      summary: PesaPal's IPN, as POST
      responses:
        '200': { description: As GET }
  /content/events:
    get:
      tags: [Website]
      summary: Published news and events, newest first (the home strip)
      responses:
        '200': { description: '[{ id, title, description, content, location, category, date, endDate, image }]' }
  /content/events/{id}:
    get:
